# Hebbian MARL parameters

# Algorithm hyperparameters
algo_args:
  # Network architecture
  hidden_dim1: 8
  hidden_dim2: 8
  
  # Hebbian plasticity parameters
  lr: 0.01               # Initial learning rate for Hebbian updates
  decay_rate: 0.001      # Exponential decay rate for learning rate
  clamp: 2.0             # Weight clamping value
  
  # Action parameters
  action_gain: 2.0       # Gain for continuous actions

# Training hyperparameters
generations: 100         # Number of generations to train
pop_size: 30            # CMA-ES population size
sigma0: 0.5             # Initial standard deviation for CMA-ES
eval_episodes: 3        # Episodes per fitness evaluation
max_steps: 600          # Maximum steps per episode
